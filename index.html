    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Shield against Vite HMR WebSocket connection errors in iframe/Cloud Run environment
      (function () {
        var RealWebSocket = window.WebSocket;
        if (RealWebSocket) {
          function isViteHmr(url, protocols) {
            var u = String(url || '');
            var p = Array.isArray(protocols) ? protocols.join(' ') : String(protocols || '');
            return (
              u.indexOf('vite-hmr') !== -1 ||
              u.indexOf('vite-ping') !== -1 ||
              u.indexOf('24678') !== -1 ||
              u.indexOf('token=') !== -1 ||
              p.indexOf('vite-hmr') !== -1 ||
              p.indexOf('vite-ping') !== -1
            );
          }

          function createMockSocket(url, protocols) {
            var listeners = { open: [], close: [], error: [], message: [] };
            var mock = {
              url: String(url || ''),
              protocol: Array.isArray(protocols) ? (protocols[0] || '') : String(protocols || ''),
              readyState: 1, // WebSocket.OPEN
              CONNECTING: 0,
              OPEN: 1,
              CLOSING: 2,
              CLOSED: 3,
              binaryType: 'blob',
              bufferedAmount: 0,
              extensions: '',
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null,
              addEventListener: function (type, fn) {
                if (!listeners[type]) listeners[type] = [];
                listeners[type].push(fn);
                if (type === 'open') {
                  queueMicrotask(function () {
                    try {
                      var ev = new Event('open');
                      if (typeof mock.onopen === 'function') mock.onopen(ev);
                      fn(ev);
                    } catch (e) {}
                  });
                }
              },
              removeEventListener: function (type, fn) {
                if (listeners[type]) {
                  listeners[type] = listeners[type].filter(function (f) { return f !== fn; });
                }
              },
              dispatchEvent: function () { return true; },
              send: function () {},
              close: function () {
                mock.readyState = 3; // CLOSED
              }
            };

            queueMicrotask(function () {
              try {
                if (typeof mock.onopen === 'function') mock.onopen(new Event('open'));
              } catch (e) {}
            });

            return mock;
          }

          function ProxiedWebSocket(url, protocols) {
            if (isViteHmr(url, protocols)) {
              return createMockSocket(url, protocols);
            }
            return new RealWebSocket(url, protocols);
          }

          ProxiedWebSocket.CONNECTING = 0;
          ProxiedWebSocket.OPEN = 1;
          ProxiedWebSocket.CLOSING = 2;
          ProxiedWebSocket.CLOSED = 3;
          ProxiedWebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket = ProxiedWebSocket;
        }

        // Catch and prevent any unhandled rejections related to WebSocket
        window.addEventListener('unhandledrejection', function (e) {
          var msg = (e && e.reason && (e.reason.message || String(e.reason))) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('vite') !== -1
          ) {
            e.preventDefault();
            if (typeof e.stopImmediatePropagation === 'function') {
              e.stopImmediatePropagation();
            }
          }
        }, true);

        // Catch window errors related to WebSocket or @vite/client
        window.addEventListener('error', function (e) {
          var msg = (e && (e.message || String(e))) || '';
          var filename = (e && e.filename) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            filename.indexOf('@vite/client') !== -1
          ) {
            e.preventDefault();
            if (typeof e.stopImmediatePropagation === 'function') {
              e.stopImmediatePropagation();
            }
          }
        }, true);

        // Filter console.error from @vite/client
        var origConsoleError = console.error;
        console.error = function () {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            str += ' ' + String(arguments[i]);
          }
          if (
            str.indexOf('[vite] failed to connect to websocket') !== -1 ||
            str.indexOf('WebSocket closed without opened') !== -1 ||
            str.indexOf('vite-hmr') !== -1 ||
            str.indexOf('vite-ping') !== -1
          ) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
